spring.application.name=NewsManagement
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NewsManagement;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Configuration
jwt.secret=NewsManagementSuperSecretKeyForJwtAuthenticationWith256BitsMinimumLength2026
jwt.expiration=86400000

# T?t v?nh vi?n ?o?n trace dài lo?ng ngo?ng
spring.web.error.include-stacktrace=never

# Luôn luôn hi?n th? câu thông báo l?i
spring.web.error.include-message=always