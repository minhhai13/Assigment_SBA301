spring.application.name=NewsManagement
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NewsManagement;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Configuration
jwt.secret=NewsManagementSuperSecretKeyForJwtAuthenticationWith256BitsMinimumLength2026
jwt.expiration=86400000

